<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030504">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kelly Info Sessions">
  <title>Kelly Education · Info Sessions</title>
  <style>
    :root {
      --kelly: #0ba14b;
      --ivory: #f3f0e8;
      --panel: #111412;
      --panel-top: #171a18;
      --gap: clamp(2px, .42vw, 7px);
      --cell-width: min(3.55vw, 5.65vh);
      --cell-height: calc(var(--cell-width) * 1.42);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030504;
      color: var(--ivory);
      touch-action: manipulation;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      font-family: "SFMono-Condensed", "Roboto Mono", "Courier New", monospace;
      background:
        radial-gradient(circle at 50% 45%, rgba(11, 161, 75, .075), transparent 42%),
        #030504;
    }

    .app {
      width: 100%;
      min-height: 100%;
      display: grid;
      grid-template-rows: 1fr auto;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }

    .display {
      display: grid;
      grid-template-columns: repeat(24, var(--cell-width));
      grid-template-rows: repeat(2, var(--cell-height));
      gap: var(--gap);
      perspective: 1100px;
      filter: drop-shadow(0 18px 40px rgba(0, 0, 0, .65));
    }

    .cell {
      position: relative;
      width: var(--cell-width);
      height: var(--cell-height);
      border: 1px solid #272c29;
      border-radius: clamp(2px, .35vw, 6px);
      overflow: hidden;
      background: linear-gradient(to bottom, var(--panel-top) 0 49.5%, #090b0a 49.5% 50.5%, var(--panel) 50.5% 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 2px 4px rgba(0,0,0,.65);
      transform-style: preserve-3d;
      transition: color 250ms ease, border-color 250ms ease, box-shadow 250ms ease, background-color 120ms ease;
      color: var(--ivory);
    }

    .cell::after {
      content: "";
      position: absolute;
      z-index: 3;
      top: calc(50% - 1px);
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(0, 0, 0, .82);
      box-shadow: 0 1px 0 rgba(255,255,255,.035);
      pointer-events: none;
    }

    .glyph {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding-top: .04em;
      font-size: calc(var(--cell-width) * .78);
      font-weight: 800;
      font-stretch: condensed;
      line-height: 1;
      color: inherit;
      text-shadow: 0 0 7px currentColor;
      transform-origin: center;
      backface-visibility: hidden;
    }

    .cell.flipping .glyph { animation: flap 65ms cubic-bezier(.5, 0, .45, 1); }
    .cell.flash { animation: settle-flash 180ms ease-out; }
    .cell.kelly-final { color: var(--kelly); border-color: rgba(11,161,75,.48); }

    @keyframes flap {
      0% { transform: rotateX(0deg); filter: brightness(1.35); }
      48% { transform: rotateX(-90deg); }
      52% { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg); filter: brightness(1); }
    }

    @keyframes settle-flash {
      0% { background: rgba(255,255,255,.22); }
      100% { background: transparent; }
    }

    .status {
      width: min(88vw, 980px);
      align-self: end;
      padding-bottom: max(2px, env(safe-area-inset-bottom));
      opacity: .78;
    }

    .status-row {
      min-height: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      color: #9ba39e;
      font-size: clamp(10px, 1.15vw, 14px);
      letter-spacing: .12em;
    }

    .paused { color: var(--kelly); opacity: 0; transition: opacity 180ms ease; }
    .paused.visible { opacity: 1; }

    .progress-track {
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: #19201c;
    }

    .progress {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--kelly);
      box-shadow: 0 0 9px rgba(11,161,75,.65);
    }

    .icon-button {
      position: fixed;
      z-index: 20;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      width: 42px;
      height: 42px;
      border: 1px solid #313834;
      border-radius: 50%;
      background: rgba(13,16,14,.78);
      color: #c8cec9;
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .start-overlay {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, .42);
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    .start-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .start-button {
      border: 1px solid rgba(11,161,75,.8);
      border-radius: 999px;
      padding: 16px 28px;
      background: rgba(5,17,10,.92);
      color: #f5f3ed;
      font: 700 clamp(14px, 1.8vw, 20px)/1 "SFMono-Condensed", "Courier New", monospace;
      letter-spacing: .14em;
      box-shadow: 0 0 32px rgba(11,161,75,.24);
      cursor: pointer;
    }

    @media (orientation: portrait) {
      :root { --cell-width: min(3.5vw, 4.8vh); --gap: clamp(1px, .32vw, 4px); }
      .app { padding-inline: 8px; }
      .status { width: 90vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cell.flipping .glyph { animation-duration: 1ms; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Kelly Education information session display">
    <section id="display" class="display" aria-live="polite" aria-label="Current orientation message"></section>
    <footer class="status">
      <div class="status-row">
        <span id="paused" class="paused">PAUSED</span>
        <span id="counter">WELCOME</span>
      </div>
      <div class="progress-track"><div id="progress" class="progress"></div></div>
    </footer>
  </main>

  <button id="mute" class="icon-button" type="button" aria-label="Unmute mechanical sound" title="Sound off">🔇</button>
  <div id="startOverlay" class="start-overlay">
    <button id="start" class="start-button" type="button">TAP TO START</button>
  </div>

  <script>
    // Configuración principal: exactamente dos filas de 24 caracteres.
    const COLS = 24;
    const ROWS = 2;
    const CHARSET = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,-/";
    const FLIP_MS = 65;
    const STAGGER_MS = 23;
    const COLORS = ["#0BA14B", "#25D9E8", "#FFB21A", "#F044B7", "#3985FF"];

    const welcome = { lines: ["WELCOME ABOARD", "KELLY EDUCATION"], duration: 8000, welcome: true };
    const rules = [
      "ARRIVE ON TIME",
      "DRESS CODE / BUSINESS PROFESSIONAL",
      "NO PERSONAL ELECTRONIC DEVICES",
      "NO PHONES IPADS OR LAPTOPS",
      "NO SOCIAL MEDIA IN CLASS",
      "NO PHOTOS OF THE CLASSROOM / EVEN WITH NO STUDENTS",
      "DO NOT SHARE SOCIAL MEDIA / OR PERSONAL INFO WITH STUDENTS",
      "NO JEANS NO CROCS",
      "NO EATING IN THE CLASSROOM",
      "NEVER LEAVE THE CLASSROOM UNATTENDED"
    ];

    const display = document.querySelector("#display");
    const progress = document.querySelector("#progress");
    const counter = document.querySelector("#counter");
    const pausedLabel = document.querySelector("#paused");
    const muteButton = document.querySelector("#mute");
    const overlay = document.querySelector("#startOverlay");
    const startButton = document.querySelector("#start");

    const cells = [];
    let currentIndex = 0; // 0 = bienvenida; 1..10 = reglas.
    let currentChars = Array(COLS * ROWS).fill(" ");
    let startedAt = performance.now();
    let carriedTime = 0;
    let paused = false;
    let muted = true;
    let audioContext = null;
    let clicksThisWindow = 0;
    let clickWindowStarted = 0;
    let wakeLock = null;

    // Construye una sola vez las 48 celdas del tablero.
    for (let i = 0; i < COLS * ROWS; i += 1) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.setAttribute("aria-hidden", "true");
      const glyph = document.createElement("span");
      glyph.className = "glyph";
      glyph.textContent = " ";
      cell.append(glyph);
      display.append(cell);
      cells.push({ cell, glyph });
    }

    const center = (text) => {
      const clean = text.toUpperCase().replace(/[^A-Z0-9 .,/\-]/g, "").trim();
      const visible = clean.slice(0, COLS);
      const left = Math.floor((COLS - visible.length) / 2);
      return " ".repeat(left) + visible + " ".repeat(COLS - visible.length - left);
    };

    // Busca el corte por palabras que deje las dos líneas lo más equilibradas posible.
    function wrapTwoLines(text) {
      // Esta regla tiene 58 caracteres; esta versión conserva el significado
      // y permite mostrarlo de forma legible en las 48 posiciones físicas.
      if (text.includes("DO NOT SHARE SOCIAL MEDIA")) {
        return ["NO SOCIAL MEDIA SHARING", "NO PERSONAL INFO TO KIDS"];
      }
      const words = text.trim().split(/\s+/);
      let best = null;
      for (let cut = 1; cut < words.length; cut += 1) {
        const a = words.slice(0, cut).join(" ");
        const b = words.slice(cut).join(" ");
        if (a.length <= COLS && b.length <= COLS) {
          const score = Math.abs(a.length - b.length);
          if (!best || score < best.score) best = { lines: [a, b], score };
        }
      }
      if (best) return best.lines;

      // Dos reglas exceden físicamente 48 posiciones. Se conservan completas mediante
      // abreviaturas claras, manteniendo el significado y las 24 columnas solicitadas.
      const compact = text
        .replace("NO PHOTOS OF THE CLASSROOM", "NO CLASSROOM PHOTOS")
        .replace("EVEN WITH NO STUDENTS", "EVEN WITHOUT STUDENTS")
        .replace("DO NOT SHARE", "DON'T SHARE")
        .replace("WITH STUDENTS", "W/ STUDENTS");
      if (compact !== text) return wrapTwoLines(compact);

      return [text.slice(0, COLS), text.slice(COLS, COLS * 2)];
    }

    function messageAt(index) {
      if (index === 0) return welcome;
      const raw = rules[index - 1];
      const lines = raw.includes("/") ? raw.split("/").map(part => part.trim()) : wrapTwoLines(raw);

      // Si una división explícita supera 24 caracteres, se redistribuye por palabras.
      if (lines.some(line => line.length > COLS)) {
        return { lines: wrapTwoLines(raw.replace("/", " ")), duration: 7000, welcome: false };
      }
      return { lines, duration: 7000, welcome: false };
    }

    function buildTarget(message) {
      return message.lines.slice(0, ROWS).map(center).join("").padEnd(COLS * ROWS, " ").split("");
    }

    // Click mecánico: ráfaga de ruido filtrada con envolvente breve y pitch variable.
    function mechanicalClick() {
      if (muted || !audioContext || audioContext.state !== "running") return;
      const now = audioContext.currentTime;
      if (now - clickWindowStarted >= 1) {
        clickWindowStarted = now;
        clicksThisWindow = 0;
      }
      if (clicksThisWindow >= 25) return;
      clicksThisWindow += 1;

      const length = Math.floor(audioContext.sampleRate * .018);
      const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / length);

      const source = audioContext.createBufferSource();
      const filter = audioContext.createBiquadFilter();
      const gain = audioContext.createGain();
      source.buffer = buffer;
      source.playbackRate.value = .88 + Math.random() * .25;
      filter.type = "bandpass";
      filter.frequency.value = 900 + Math.random() * 650;
      filter.Q.value = 1.1;
      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(.075, now + .002);
      gain.gain.exponentialRampToValueAtTime(.0001, now + .019);
      source.connect(filter).connect(gain).connect(audioContext.destination);
      source.start(now);
      source.stop(now + .022);
    }

    async function flipCell(index, finalChar, isKellyLine) {
      const { cell, glyph } = cells[index];
      let cursor = CHARSET.indexOf(currentChars[index]);
      if (cursor < 0) cursor = 0;
      const target = CHARSET.indexOf(finalChar);
      const steps = finalChar === currentChars[index] ? 0 : 4 + Math.floor(Math.random() * 6);

      cell.classList.remove("kelly-final", "flash");
      for (let step = 0; step < steps; step += 1) {
        cursor = (cursor + 1 + Math.floor(Math.random() * 3)) % CHARSET.length;
        glyph.textContent = CHARSET[cursor];
        const color = COLORS[step % COLORS.length];
        cell.style.color = color;
        cell.style.borderColor = color;
        cell.style.boxShadow = `0 0 10px ${color}55, inset 0 1px 0 rgba(255,255,255,.06)`;
        cell.classList.remove("flipping");
        void cell.offsetWidth;
        cell.classList.add("flipping");
        mechanicalClick();
        await new Promise(resolve => setTimeout(resolve, FLIP_MS));
      }

      glyph.textContent = target >= 0 ? CHARSET[target] : finalChar;
      currentChars[index] = finalChar;
      cell.classList.remove("flipping");
      cell.classList.add("flash");
      cell.style.color = "";
      cell.style.borderColor = "";
      cell.style.boxShadow = "";
      if (isKellyLine && finalChar !== " ") cell.classList.add("kelly-final");
    }

    function showMessage(index) {
      currentIndex = (index + rules.length + 1) % (rules.length + 1);
      const message = messageAt(currentIndex);
      const target = buildTarget(message);
      display.setAttribute("aria-label", message.lines.join(". "));
      counter.textContent = currentIndex === 0 ? "WELCOME" : `${currentIndex} / ${rules.length}`;

      target.forEach((char, i) => {
        setTimeout(() => flipCell(i, char, message.welcome && i >= COLS), (i % COLS) * STAGGER_MS);
      });

      carriedTime = 0;
      startedAt = performance.now();
      progress.style.width = "0%";
    }

    function tick(now) {
      const duration = messageAt(currentIndex).duration;
      if (!paused) {
        const elapsed = carriedTime + (now - startedAt);
        progress.style.width = `${Math.min(100, elapsed / duration * 100)}%`;
        if (elapsed >= duration) showMessage((currentIndex + 1) % (rules.length + 1));
      }
      requestAnimationFrame(tick);
    }

    function togglePause() {
      if (paused) {
        paused = false;
        startedAt = performance.now();
      } else {
        carriedTime += performance.now() - startedAt;
        paused = true;
      }
      pausedLabel.classList.toggle("visible", paused);
    }

    async function unlockAudio() {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      await audioContext.resume();
      muted = false;
      muteButton.textContent = "🔊";
      muteButton.title = "Sound on";
      muteButton.setAttribute("aria-label", "Mute mechanical sound");
      overlay.classList.add("hidden");
      requestWakeLock();
    }

    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator && document.visibilityState === "visible") {
          wakeLock = await navigator.wakeLock.request("screen");
        }
      } catch (_) { /* Fallback silencioso para navegadores sin permiso/soporte. */ }
    }

    startButton.addEventListener("click", unlockAudio);
    muteButton.addEventListener("click", async () => {
      if (!audioContext || audioContext.state !== "running") {
        await unlockAudio();
        return;
      }
      muted = !muted;
      muteButton.textContent = muted ? "🔇" : "🔊";
      muteButton.title = muted ? "Sound off" : "Sound on";
      muteButton.setAttribute("aria-label", muted ? "Unmute mechanical sound" : "Mute mechanical sound");
    });

    document.addEventListener("keydown", event => {
      if (event.code === "Space") {
        event.preventDefault();
        togglePause();
      } else if (event.key === "ArrowRight") {
        showMessage((currentIndex + 1) % (rules.length + 1));
      } else if (event.key === "ArrowLeft") {
        showMessage((currentIndex - 1 + rules.length + 1) % (rules.length + 1));
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") requestWakeLock();
    });

    // Bloquea el gesto de pellizco en Safari iOS sin impedir los botones.
    document.addEventListener("gesturestart", event => event.preventDefault(), { passive: false });

    // La secuencia visual empieza de inmediato; TAP TO START solo habilita el audio.
    showMessage(0);
    requestAnimationFrame(tick);
    requestWakeLock();
  </script>
</body>
</html>
