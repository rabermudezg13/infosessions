<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030504">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kelly Info Sessions">
  <title>Kelly Education · Info Sessions</title>
  <style>
    :root {
      --kelly: #0ba14b;
      --ivory: #ffffff;
      --panel: #151917;
      --panel-top: #202522;
      --gap: clamp(2px, .18vw, 5px);
      /* Usa casi todo el ancho: 24 módulos + separaciones. */
      --cell-width: min(3.78vw, 8.4vh);
      --cell-height: calc(var(--cell-width) * 1.52);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030504;
      color: var(--ivory);
      touch-action: manipulation;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      font-family: "SFMono-Condensed", "Roboto Mono", "Courier New", monospace;
      background:
        radial-gradient(circle at 50% 45%, rgba(11, 161, 75, .075), transparent 42%),
        #030504;
    }

    .app {
      width: 100%;
      min-height: 100%;
      display: grid;
      grid-template-rows: 1fr auto auto;
      place-items: center;
      padding: max(12px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    }

    .display {
      display: grid;
      grid-template-columns: repeat(24, var(--cell-width));
      grid-template-rows: repeat(2, var(--cell-height));
      gap: var(--gap);
      perspective: 1400px;
      filter: drop-shadow(0 18px 40px rgba(0, 0, 0, .65));
    }

    .cell {
      position: relative;
      width: var(--cell-width);
      height: var(--cell-height);
      border: 1px solid #3b433e;
      border-radius: clamp(2px, .35vw, 6px);
      overflow: hidden;
      background: #090b0a;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 3px 7px rgba(0,0,0,.8);
      transform-style: preserve-3d;
      transition: color 250ms ease, border-color 250ms ease, box-shadow 250ms ease, background-color 120ms ease;
      color: var(--ivory);
    }

    /* Ranura y remaches centrales, como un módulo mecánico real. */
    .cell::after {
      content: "";
      position: absolute;
      z-index: 8;
      top: calc(50% - 1.5px);
      left: 0;
      width: 100%;
      height: 3px;
      background:
        radial-gradient(circle at 5px 50%, #59605c 0 1px, #080908 1.5px 2.5px, transparent 3px),
        radial-gradient(circle at calc(100% - 5px) 50%, #59605c 0 1px, #080908 1.5px 2.5px, transparent 3px),
        linear-gradient(#020302, #111411 45%, #020302);
      pointer-events: none;
    }

    .half {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      backface-visibility: hidden;
    }

    .half-top {
      top: 0;
      background: linear-gradient(#272c29 0%, var(--panel-top) 78%, #131613 100%);
    }

    .half-bottom {
      bottom: 0;
      background: linear-gradient(#0c0e0d 0%, var(--panel) 25%, #0d100e 100%);
    }

    .glyph {
      position: absolute;
      left: 0;
      width: 100%;
      height: var(--cell-height);
      display: grid;
      place-items: center;
      padding-top: .04em;
      font-family: "Arial Narrow", "Roboto Condensed", "Aptos Narrow", "SFMono-Condensed", "Courier New", monospace;
      font-size: calc(var(--cell-width) * 1.18);
      font-weight: 900;
      font-stretch: condensed;
      line-height: .92;
      letter-spacing: -.09em;
      transform: scaleX(.78);
      color: inherit;
      text-shadow: 0 0 5px currentColor, 0 1px 1px #000;
      backface-visibility: hidden;
    }

    .half-top .glyph, .flap-front .glyph { top: 0; }
    .half-bottom .glyph, .flap-back .glyph { top: calc(var(--cell-height) * -.5); }

    /* Aleta móvil: frente = mitad superior anterior; reverso = mitad inferior nueva. */
    .flap {
      position: absolute;
      z-index: 6;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      transform-origin: 50% 100%;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .flap-face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flap-front {
      background: linear-gradient(#292f2b 0%, var(--panel-top) 78%, #111411 100%);
    }

    .flap-back {
      transform: rotateX(180deg);
      background: linear-gradient(#0a0c0b 0%, #181c19 24%, #101311 100%);
    }

    .cell.flipping .flap { animation: airport-flap 90ms cubic-bezier(.35, .02, .25, 1); }
    .cell.flipping { animation: module-shake 90ms linear; }
    .cell.flash { animation: settle-flash 180ms ease-out; }
    .cell.brand-green {
      color: #18d366;
      border-color: rgba(24,211,102,.68);
      box-shadow: 0 0 8px rgba(11,161,75,.22), inset 0 1px 0 rgba(255,255,255,.06);
    }

    @keyframes airport-flap {
      0% { transform: rotateX(0deg); filter: brightness(1.16); }
      46% { transform: rotateX(-84deg); filter: brightness(.58); }
      52% { transform: rotateX(-96deg); filter: brightness(.48); }
      88% { transform: rotateX(-184deg); filter: brightness(.9); }
      100% { transform: rotateX(-180deg); filter: brightness(1); }
    }

    @keyframes module-shake {
      0%, 72% { transform: translateY(0); }
      82% { transform: translateY(.7px); }
      100% { transform: translateY(0); }
    }

    @keyframes settle-flash {
      0% { background: rgba(255,255,255,.22); }
      100% { background: transparent; }
    }

    .note {
      width: min(94vw, 1500px);
      min-height: 3em;
      display: grid;
      place-items: center;
      padding: 0 2vw;
      color: #b8c2bc;
      text-align: center;
      font-size: clamp(15px, 1.32vw, 28px);
      font-weight: 600;
      line-height: 1.38;
      letter-spacing: .015em;
      text-wrap: balance;
      text-shadow: 0 2px 3px #000;
      opacity: 1;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .note.changing {
      opacity: 0;
      transform: translateY(5px);
    }

    .status {
      width: min(94vw, 1500px);
      align-self: end;
      padding-bottom: max(2px, env(safe-area-inset-bottom));
      opacity: .78;
    }

    .status-row {
      min-height: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      color: #9ba39e;
      font-size: clamp(10px, 1.15vw, 14px);
      letter-spacing: .12em;
    }

    .paused { color: var(--kelly); opacity: 0; transition: opacity 180ms ease; }
    .paused.visible { opacity: 1; }

    .progress-track {
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: #19201c;
    }

    .progress {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--kelly);
      box-shadow: 0 0 9px rgba(11,161,75,.65);
    }

    .icon-button {
      position: fixed;
      z-index: 20;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      width: 42px;
      height: 42px;
      border: 1px solid #313834;
      border-radius: 50%;
      background: rgba(13,16,14,.78);
      color: #c8cec9;
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .start-overlay {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, .42);
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    .start-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .start-button {
      border: 1px solid rgba(11,161,75,.8);
      border-radius: 999px;
      padding: 16px 28px;
      background: rgba(5,17,10,.92);
      color: #f5f3ed;
      font: 700 clamp(14px, 1.8vw, 20px)/1 "SFMono-Condensed", "Courier New", monospace;
      letter-spacing: .14em;
      box-shadow: 0 0 32px rgba(11,161,75,.24);
      cursor: pointer;
    }

    /* En televisores Full HD y 4K las letras crecen con el ancho real de la pantalla. */
    @media (min-width: 1400px) and (orientation: landscape) {
      :root {
        --cell-width: 3.82vw;
        --cell-height: calc(var(--cell-width) * 1.58);
        --gap: .13vw;
      }
      .glyph {
        font-size: calc(var(--cell-width) * 1.24);
        transform: scaleX(.75);
        text-shadow: 0 0 7px currentColor, 0 2px 2px #000;
      }
      .cell { border-width: 2px; }
      .status, .note { width: 96vw; }
      .note { font-size: clamp(20px, 1.38vw, 30px); }
    }

    @media (orientation: portrait) {
      :root { --cell-width: min(3.7vw, 6.2vh); --gap: clamp(1px, .18vw, 3px); }
      .app { padding-inline: 5px; }
      .glyph { font-size: calc(var(--cell-width) * 1.12); }
      .status { width: 94vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cell.flipping .flap, .cell.flipping { animation-duration: 1ms; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Kelly Education information session display">
    <section id="display" class="display" aria-live="polite" aria-label="Current orientation message"></section>
    <div id="note" class="note" aria-live="polite"></div>
    <footer class="status">
      <div class="status-row">
        <span id="paused" class="paused">PAUSED</span>
        <span id="counter">WELCOME</span>
      </div>
      <div class="progress-track"><div id="progress" class="progress"></div></div>
    </footer>
  </main>

  <button id="mute" class="icon-button" type="button" aria-label="Unmute mechanical sound" title="Sound off">🔇</button>
  <div id="startOverlay" class="start-overlay">
    <button id="start" class="start-button" type="button">TAP TO START</button>
  </div>

  <script>
    // Configuración principal: exactamente dos filas de 24 caracteres.
    const COLS = 24;
    const ROWS = 2;
    const CHARSET = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,-/";
    const FLIP_MS = 90;
    const STAGGER_MS = 23;
    const COLORS = ["#0BA14B", "#25D9E8", "#FFB21A", "#F044B7", "#3985FF"];

    const welcome = { lines: ["WELCOME ABOARD", "KELLY EDUCATION"], duration: 8000, welcome: true };
    const rules = [
      { text: "ARRIVE ON TIME" },
      { text: "DRESS CODE / BUSINESS PROFESSIONAL" },
      { text: "NO PERSONAL / ELECTRONIC DEVICES" },
      { text: "NO PHONES IPADS / OR LAPTOPS" },
      { text: "NO SOCIAL MEDIA / IN CLASS" },
      { text: "NO PHOTOS OF / THE CLASSROOM", note: "No classroom photos — even when no students are present." },
      { text: "DO NOT SHARE / SOCIAL MEDIA", note: "Never share social media or personal information with students." },
      { text: "NO JEANS NO CROCS" },
      { text: "NO EATING / IN THE CLASSROOM" },
      { text: "NEVER LEAVE / THE CLASSROOM", note: "Never leave the classroom unattended." },

      // Substitute Teacher Accountability Notes: título grande arriba
      // y la instrucción completa debajo para conservar legibilidad y contexto.
      { text: "READ THE / ASSIGNMENT NOTES", note: "Review all assignment notes carefully. They may contain important details and expectations specific to the role or classroom." },
      { text: "CONFIRM AND FOLLOW / THE DIRECTIONS", note: "Confirm that you understand the directions, then follow them to support the students and the school." },
      { text: "CHECK FOR / ATTACHMENTS", note: "Attachments may contain your lesson plan or additional instructions. Review them before the assignment begins." },
      { text: "REMAIN ONSITE / DURING LUNCH", note: "Substitute teachers may not leave the building for lunch. Plan ahead and bring a packed lunch." },
      { text: "MAINTAIN / PROFESSIONAL ATTIRE", note: "Dress professionally and avoid attire that could draw unnecessary attention or distract students." },
      { text: "DO NOT TAKE / DESK SNACKS", note: "Do not eat or distribute snacks or candy from the teacher's desk. Leave all items where they are." },
      { text: "ARRIVE 15 MINUTES / EARLY", note: "Confirm the exact assignment location, allow time to park and check in with the sub coordinator or main office." }
    ];

    const display = document.querySelector("#display");
    const note = document.querySelector("#note");
    const progress = document.querySelector("#progress");
    const counter = document.querySelector("#counter");
    const pausedLabel = document.querySelector("#paused");
    const muteButton = document.querySelector("#mute");
    const overlay = document.querySelector("#startOverlay");
    const startButton = document.querySelector("#start");

    const cells = [];
    let currentIndex = 0; // 0 = bienvenida; 1..17 = reglas y notas.
    let currentChars = Array(COLS * ROWS).fill(" ");
    let startedAt = performance.now();
    let carriedTime = 0;
    let paused = false;
    let muted = true;
    let audioContext = null;
    let clicksThisWindow = 0;
    let clickWindowStarted = 0;
    let wakeLock = null;

    // Construye una sola vez las 48 celdas del tablero.
    for (let i = 0; i < COLS * ROWS; i += 1) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.setAttribute("aria-hidden", "true");

      const top = document.createElement("span");
      top.className = "half half-top";
      const topGlyph = document.createElement("span");
      topGlyph.className = "glyph";
      top.append(topGlyph);

      const bottom = document.createElement("span");
      bottom.className = "half half-bottom";
      const bottomGlyph = document.createElement("span");
      bottomGlyph.className = "glyph";
      bottom.append(bottomGlyph);

      const flap = document.createElement("span");
      flap.className = "flap";
      const flapFront = document.createElement("span");
      flapFront.className = "flap-face flap-front";
      const frontGlyph = document.createElement("span");
      frontGlyph.className = "glyph";
      flapFront.append(frontGlyph);
      const flapBack = document.createElement("span");
      flapBack.className = "flap-face flap-back";
      const backGlyph = document.createElement("span");
      backGlyph.className = "glyph";
      flapBack.append(backGlyph);
      flap.append(flapFront, flapBack);

      [topGlyph, bottomGlyph, frontGlyph, backGlyph].forEach(glyph => { glyph.textContent = " "; });
      cell.append(top, bottom, flap);
      display.append(cell);
      cells.push({ cell, flap, topGlyph, bottomGlyph, frontGlyph, backGlyph });
    }

    const center = (text) => {
      const clean = text.toUpperCase().replace(/[^A-Z0-9 .,/\-]/g, "").trim();
      const visible = clean.slice(0, COLS);
      const left = Math.floor((COLS - visible.length) / 2);
      return " ".repeat(left) + visible + " ".repeat(COLS - visible.length - left);
    };

    // Busca el corte por palabras que deje las dos líneas lo más equilibradas posible.
    function wrapTwoLines(text) {
      // Esta regla tiene 58 caracteres; esta versión conserva el significado
      // y permite mostrarlo de forma legible en las 48 posiciones físicas.
      if (text.includes("DO NOT SHARE SOCIAL MEDIA")) {
        return ["NO SOCIAL MEDIA SHARING", "NO PERSONAL INFO TO KIDS"];
      }
      const words = text.trim().split(/\s+/);
      let best = null;
      for (let cut = 1; cut < words.length; cut += 1) {
        const a = words.slice(0, cut).join(" ");
        const b = words.slice(cut).join(" ");
        if (a.length <= COLS && b.length <= COLS) {
          const score = Math.abs(a.length - b.length);
          if (!best || score < best.score) best = { lines: [a, b], score };
        }
      }
      if (best) return best.lines;

      // Dos reglas exceden físicamente 48 posiciones. Se conservan completas mediante
      // abreviaturas claras, manteniendo el significado y las 24 columnas solicitadas.
      const compact = text
        .replace("NO PHOTOS OF THE CLASSROOM", "NO CLASSROOM PHOTOS")
        .replace("EVEN WITH NO STUDENTS", "EVEN WITHOUT STUDENTS")
        .replace("DO NOT SHARE", "DON'T SHARE")
        .replace("WITH STUDENTS", "W/ STUDENTS");
      if (compact !== text) return wrapTwoLines(compact);

      return [text.slice(0, COLS), text.slice(COLS, COLS * 2)];
    }

    function messageAt(index) {
      if (index === 0) return welcome;
      const item = rules[index - 1];
      const raw = item.text;
      const lines = raw.includes("/") ? raw.split("/").map(part => part.trim()) : wrapTwoLines(raw);

      // Si una división explícita supera 24 caracteres, se redistribuye por palabras.
      if (lines.some(line => line.length > COLS)) {
        return { lines: wrapTwoLines(raw.replace("/", " ")), note: item.note || "", duration: 7000, welcome: false };
      }
      return { lines, note: item.note || "", duration: 7000, welcome: false };
    }

    function buildTarget(message) {
      return message.lines.slice(0, ROWS).map(center).join("").padEnd(COLS * ROWS, " ").split("");
    }

    // Click mecánico: ráfaga de ruido filtrada con envolvente breve y pitch variable.
    function mechanicalClick() {
      if (muted || !audioContext || audioContext.state !== "running") return;
      const now = audioContext.currentTime;
      if (now - clickWindowStarted >= 1) {
        clickWindowStarted = now;
        clicksThisWindow = 0;
      }
      if (clicksThisWindow >= 25) return;
      clicksThisWindow += 1;

      const length = Math.floor(audioContext.sampleRate * .018);
      const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / length);

      const source = audioContext.createBufferSource();
      const filter = audioContext.createBiquadFilter();
      const gain = audioContext.createGain();
      source.buffer = buffer;
      source.playbackRate.value = .88 + Math.random() * .25;
      filter.type = "bandpass";
      filter.frequency.value = 900 + Math.random() * 650;
      filter.Q.value = 1.1;
      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(.075, now + .002);
      gain.gain.exponentialRampToValueAtTime(.0001, now + .019);
      source.connect(filter).connect(gain).connect(audioContext.destination);
      source.start(now);
      source.stop(now + .022);
    }

    // Ejecuta una caída física entre dos caracteres: arriba se descubre el nuevo,
    // abajo conserva el anterior hasta que el reverso de la aleta aterriza.
    async function dropFlap(parts, fromChar, toChar) {
      const { cell, topGlyph, bottomGlyph, frontGlyph, backGlyph } = parts;
      topGlyph.textContent = toChar;
      bottomGlyph.textContent = fromChar;
      frontGlyph.textContent = fromChar;
      backGlyph.textContent = toChar;
      cell.classList.remove("flipping");
      void cell.offsetWidth;
      cell.classList.add("flipping");
      mechanicalClick();
      await new Promise(resolve => setTimeout(resolve, FLIP_MS));
      topGlyph.textContent = toChar;
      bottomGlyph.textContent = toChar;
      frontGlyph.textContent = toChar;
      backGlyph.textContent = toChar;
      cell.classList.remove("flipping");
    }

    async function flipCell(index, finalChar, useBrandGreen) {
      const parts = cells[index];
      const { cell } = parts;
      let cursor = CHARSET.indexOf(currentChars[index]);
      if (cursor < 0) cursor = 0;
      const target = CHARSET.indexOf(finalChar);
      const steps = finalChar === currentChars[index] ? 0 : 4 + Math.floor(Math.random() * 6);
      let visibleChar = currentChars[index];

      cell.classList.remove("brand-green", "flash");
      for (let step = 0; step < steps; step += 1) {
        cursor = (cursor + 1 + Math.floor(Math.random() * 3)) % CHARSET.length;
        const nextChar = CHARSET[cursor];
        const color = COLORS[step % COLORS.length];
        cell.style.color = color;
        cell.style.borderColor = color;
        cell.style.boxShadow = `0 0 10px ${color}55, inset 0 1px 0 rgba(255,255,255,.06)`;
        await dropFlap(parts, visibleChar, nextChar);
        visibleChar = nextChar;
      }

      const settledChar = target >= 0 ? CHARSET[target] : finalChar;
      if (visibleChar !== settledChar) await dropFlap(parts, visibleChar, settledChar);
      currentChars[index] = finalChar;
      cell.classList.remove("flipping");
      cell.classList.add("flash");
      cell.style.color = "";
      cell.style.borderColor = "";
      cell.style.boxShadow = "";
      if (useBrandGreen && finalChar !== " ") cell.classList.add("brand-green");
    }

    function showMessage(index) {
      currentIndex = (index + rules.length + 1) % (rules.length + 1);
      const message = messageAt(currentIndex);
      const target = buildTarget(message);
      display.setAttribute("aria-label", [message.lines.join(". "), message.note || ""].filter(Boolean).join(". "));
      note.classList.add("changing");
      setTimeout(() => {
        note.textContent = message.note || "";
        note.classList.remove("changing");
      }, 220);
      counter.textContent = currentIndex === 0 ? "WELCOME" : `${currentIndex} / ${rules.length}`;

      target.forEach((char, i) => {
        // En la bienvenida, KELLY queda blanco y EDUCATION usa el verde de marca.
        // Se calcula la posición a partir de la línea centrada para no depender
        // de números mágicos si el ancho cambia en el futuro.
        const secondLine = center("KELLY EDUCATION");
        const educationStart = secondLine.indexOf("EDUCATION");
        const column = i % COLS;
        const useBrandGreen = message.welcome && i >= COLS && column >= educationStart;
        setTimeout(() => flipCell(i, char, useBrandGreen), (i % COLS) * STAGGER_MS);
      });

      carriedTime = 0;
      startedAt = performance.now();
      progress.style.width = "0%";
    }

    function tick(now) {
      const duration = messageAt(currentIndex).duration;
      if (!paused) {
        const elapsed = carriedTime + (now - startedAt);
        progress.style.width = `${Math.min(100, elapsed / duration * 100)}%`;
        if (elapsed >= duration) showMessage((currentIndex + 1) % (rules.length + 1));
      }
      requestAnimationFrame(tick);
    }

    function togglePause() {
      if (paused) {
        paused = false;
        startedAt = performance.now();
      } else {
        carriedTime += performance.now() - startedAt;
        paused = true;
      }
      pausedLabel.classList.toggle("visible", paused);
    }

    async function unlockAudio() {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      await audioContext.resume();
      muted = false;
      muteButton.textContent = "🔊";
      muteButton.title = "Sound on";
      muteButton.setAttribute("aria-label", "Mute mechanical sound");
      overlay.classList.add("hidden");
      requestWakeLock();
    }

    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator && document.visibilityState === "visible") {
          wakeLock = await navigator.wakeLock.request("screen");
        }
      } catch (_) { /* Fallback silencioso para navegadores sin permiso/soporte. */ }
    }

    startButton.addEventListener("click", unlockAudio);
    muteButton.addEventListener("click", async () => {
      if (!audioContext || audioContext.state !== "running") {
        await unlockAudio();
        return;
      }
      muted = !muted;
      muteButton.textContent = muted ? "🔇" : "🔊";
      muteButton.title = muted ? "Sound off" : "Sound on";
      muteButton.setAttribute("aria-label", muted ? "Unmute mechanical sound" : "Mute mechanical sound");
    });

    document.addEventListener("keydown", event => {
      if (event.code === "Space") {
        event.preventDefault();
        togglePause();
      } else if (event.key === "ArrowRight") {
        showMessage((currentIndex + 1) % (rules.length + 1));
      } else if (event.key === "ArrowLeft") {
        showMessage((currentIndex - 1 + rules.length + 1) % (rules.length + 1));
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") requestWakeLock();
    });

    // Bloquea el gesto de pellizco en Safari iOS sin impedir los botones.
    document.addEventListener("gesturestart", event => event.preventDefault(), { passive: false });

    // La secuencia visual empieza de inmediato; TAP TO START solo habilita el audio.
    showMessage(0);
    requestAnimationFrame(tick);
    requestWakeLock();
  </script>
</body>
</html>
